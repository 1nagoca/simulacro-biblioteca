services:
  libros:
    build:
      context: ./libros
    container_name: libros
    ports:
      - "8091:8091"

  prestamos:
    build:
      context: ./prestamos
    container_name: prestamos
    ports:
      - "8092:8092"
    environment:
      - LIBROS_URL=http://libros:8091
    depends_on:
      - libros
